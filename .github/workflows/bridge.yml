name: RDP Bridge

on:
  repository_dispatch:
    types: [RDP]
  workflow_dispatch:
    inputs:
      ip:
        description: 'Target Tailscale IP'
        required: true
      username:
        description: 'Target Windows Username'
        required: false
      password:
        description: 'Target Windows Password'
        required: false

concurrency:
  group: rdp-bridge-${{ github.event.client_payload.ip || inputs.ip || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  RDP:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DEBIAN_FRONTEND: noninteractive
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      APT_UPDATE_TIMEOUT: 300
      APT_INSTALL_TIMEOUT: 480
      APT_MAX_ATTEMPTS: 5

    steps:
      - name: Preflight validation
        env:
          DISPATCH_IP: ${{ github.event.client_payload.ip }}
          INPUT_IP: ${{ inputs.ip }}
        run: |
          set -euo pipefail
          fail=0

          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "::error::Secret TAILSCALE_AUTH_KEY is missing"; fail=1
          fi

          IP="${DISPATCH_IP:-${INPUT_IP:-}}"
          if [ -z "$IP" ]; then
            echo "::error::No target IP supplied"; fail=1
          fi

          echo "Runner: $(lsb_release -ds 2>/dev/null || head -1 /etc/os-release)"
          [ "$fail" -eq 1 ] && exit 1
          echo "Preflight OK -> $IP"

      - name: Install dependencies
        timeout-minutes: 60
        run: |
          set -uo pipefail

          apt_get() {
            local cap="$1"; shift
            sudo timeout --kill-after=20s "${cap}s" apt-get "$@" \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::ForceIPv4=true \
              -o Dpkg::Options::=--force-confdef \
              -o Dpkg::Options::=--force-confold
          }

          recover_apt() {
            echo "::warning::apt/dpkg stuck - killing and cleaning up"
            sudo pkill -9 -f 'apt-get|dpkg|unattended-upgr' 2>/dev/null || true
            sleep 2
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
                       /var/cache/apt/archives/lock /var/lib/apt/lists/lock 2>/dev/null || true
            sudo dpkg --configure -a >/dev/null 2>&1 || true
            sudo timeout 120s apt-get -f install -y --no-install-recommends >/dev/null 2>&1 || true
            sleep 5
          }

          for i in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 --max-time 60 \
                 https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
                 | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null \
               && curl -fsSL --retry 3 --retry-delay 2 --max-time 60 \
                 https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list \
                 | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null ; then
              break
            fi
            echo "::warning::Repo setup attempt $i failed"
            sleep 5
          done

          ok=0
          for i in $(seq 1 "$APT_MAX_ATTEMPTS"); do
            if apt_get "$APT_UPDATE_TIMEOUT" update; then ok=1; break; fi
            recover_apt
          done
          [ "$ok" -eq 1 ] || { echo "::error::apt-get update failed"; exit 1; }

          RDP_PKG=""
          for pkg in freerdp3-x11 freerdp2-x11 freerdp-x11; do
            if apt-cache pkgnames "$pkg" 2>/dev/null | grep -qx "$pkg"; then
              RDP_PKG="$pkg"; break
            fi
          done
          if [ -z "$RDP_PKG" ]; then
            echo "::error::No FreeRDP X11 package available"
            apt-cache search freerdp || true
            exit 1
          fi
          echo "Using package: $RDP_PKG"

          ok=0
          for i in $(seq 1 "$APT_MAX_ATTEMPTS"); do
            if apt_get "$APT_INSTALL_TIMEOUT" install -y --no-install-recommends \
                 "$RDP_PKG" tailscale xvfb ; then
              ok=1; break
            fi
            recover_apt
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Core package install failed"
            exit 1
          fi

          AUDIO_OK=0
          for i in 1 2 3; do
            if apt_get "$APT_INSTALL_TIMEOUT" install -y --no-install-recommends \
                 pulseaudio alsa-utils libasound2-plugins ; then
              AUDIO_OK=1; break
            fi
            recover_apt
          done
          echo "AUDIO_OK=$AUDIO_OK" >> "$GITHUB_ENV"
          [ "$AUDIO_OK" -eq 1 ] || echo "::warning::Audio unavailable"

          if ! command -v xfreerdp >/dev/null 2>&1; then
            if command -v xfreerdp3 >/dev/null 2>&1; then
              sudo ln -sf "$(command -v xfreerdp3)" /usr/local/bin/xfreerdp
              echo "::notice::xfreerdp not shipped - linked xfreerdp3 -> xfreerdp"
            elif command -v xfreerdp2 >/dev/null 2>&1; then
              sudo ln -sf "$(command -v xfreerdp2)" /usr/local/bin/xfreerdp
              echo "::notice::xfreerdp not shipped - linked xfreerdp2 -> xfreerdp"
            else
              echo "::error::No xfreerdp binary after install"
              dpkg -L "$RDP_PKG" || true
              exit 1
            fi
          fi
          xfreerdp /version || true

      - name: Authenticate Tailscale
        timeout-minutes: 5
        run: |
          set -uo pipefail
          HOST="rdp-bridge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          ok=0
          for i in 1 2 3 4; do
            if sudo tailscale up --authkey="$TS_AUTHKEY" \
                                 --hostname="$HOST" \
                                 --accept-routes --timeout=60s ; then
              ok=1; break
            fi
            echo "::warning::tailscale up attempt $i failed"
            sudo tailscale down >/dev/null 2>&1 || true
            sleep $((i * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Tailscale auth failed"
            sudo tailscale status || true
            exit 1
          fi
          sudo tailscale status || true

      - name: Resolve IP & Credentials
        run: |
          TARGET_IP="${{ github.event.client_payload.ip || inputs.ip }}"
          TARGET_USER="${{ github.event.client_payload.username || inputs.username || secrets.RDP_USER || 'Cloud PC' }}"
          TARGET_PASS="${{ github.event.client_payload.password || inputs.password || secrets.RDP_PASSWORD || '123456' }}"

          if [ -z "$TARGET_IP" ]; then
            echo "::error::TARGET_IP is empty"
            exit 1
          fi

          echo "TARGET_IP=$TARGET_IP"     >> $GITHUB_ENV
          echo "TARGET_USER=$TARGET_USER" >> $GITHUB_ENV
          echo "TARGET_PASS=$TARGET_PASS" >> $GITHUB_ENV

          echo "::add-mask::$TARGET_PASS"
          echo "::add-mask::$TARGET_USER"
          echo "Resolved target: $TARGET_IP"

      - name: Run Persistent RDP Session inside XVFB
        run: |
          echo "Connecting headless RDP session to $TARGET_IP..."

          # 1. Start Virtual X Server
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2

          # 2. Start Virtual PulseAudio Daemon for Sound Handling
          pulseaudio --start --exit-idle-time=-1
          sleep 1

          # 3. Launch FreeRDP session with sound redirection
          xfreerdp /v:"$TARGET_IP" \
                   /u:"$TARGET_USER" \
                   /p:"$TARGET_PASS" \
                   /size:1920x1080 \
                   /cert-ignore \
                   /cert:ignore \
                   /gfx \
                   /network:auto \
                   /sound:sys:pulse &

          RDP_PID=$!
          echo "RDP Client running under PID: $RDP_PID"

          # Give process a moment to establish connection
          sleep 5

          # 4. Monitor loop: Keep active as long as RDP session remains alive
          while kill -0 $RDP_PID 2>/dev/null; do
            echo "[$(date)] Linux Bridge actively maintaining GUI & Audio session on $TARGET_IP..."
            sleep 15
          done

          echo "RDP connection closed or overridden. Terminating action cleanly."

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::Tailscale status";  sudo tailscale status || true;        echo "::endgroup::"
          echo "::group::Processes"
          ps -eo pid,etime,cmd | grep -Ei 'xfreerdp|Xvfb|pulseaudio|tailscale' | grep -v grep || true
          echo "::endgroup::"
          echo "::group::FreeRDP packages";  dpkg -l | grep -i freerdp || true;     echo "::endgroup::"
          echo "::group::apt history";       tail -n 40 /var/log/apt/history.log 2>/dev/null || true; echo "::endgroup::"
          echo "::group::Disk";              df -h;                                echo "::endgroup::"
